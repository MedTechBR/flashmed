<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 296" role="img" aria-label="Esquema do algoritmo 0/1 hora da troponina ultrassensível"><style>text{font-family:Figtree,system-ui,sans-serif} .t{font-size:13px;font-weight:600;fill:#23272E}.l{font-size:11px;fill:#5E646B} .k{font-size:11px;font-weight:600;fill:#0B6A72}</style><rect width="560" height="296" fill="#FFFFFF"/><text class="t" x="16" y="24">Troponina ultrassensível: o que cada resultado decide</text><rect x="60" y="60" width="200" height="54" rx="10" fill="#E6F3EB" stroke="#1D7A46"/><text class="k" x="76" y="84" fill="#1D7A46">Muito baixa na chegada</text><text class="l" x="76" y="102">e sintoma há mais de 3 h → exclui</text><rect x="300" y="60" width="200" height="54" rx="10" fill="#FBEAE8" stroke="#C6453D"/><text class="k" x="316" y="84" fill="#C6453D">Alta na chegada</text><text class="l" x="316" y="102">ou variação grande → inclui</text><rect x="180" y="150" width="200" height="54" rx="10" fill="#FBF1DC" stroke="#A3730A"/><text class="k" x="196" y="174" fill="#A3730A">Zona de observação</text><text class="l" x="196" y="192">repetir em 3 h · ECG · eco</text><path d="M160 114 L250 150" stroke="#5E646B" stroke-width="1.4" marker-end="url(#a)"/><path d="M400 114 L320 150" stroke="#5E646B" stroke-width="1.4"/><text class="l" x="60" y="238">Variação entre as duas medidas = lesão AGUDA.</text><text class="l" x="60" y="256">Valor alto e estável, sem variação = lesão crônica.</text><text class="l" x="60" y="274">Infarto exige lesão aguda MAIS evidência de isquemia: sintoma, ECG, imagem ou angiografia.</text></svg>