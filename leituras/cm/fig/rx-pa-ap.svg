<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 372" role="img" aria-label="PA × AP e o índice cardiotorácico"><style>text{font-family:Figtree,system-ui,sans-serif}.t{font-size:13.5px;font-weight:600;fill:#23272E}.l{font-size:10.5px;fill:#5E646B}.k{font-size:10.5px;font-weight:600;fill:#0B6A72}.r{font-size:10.5px;font-weight:600;fill:#C6453D}.a{font-size:10.5px;font-weight:600;fill:#A3730A}.v{font-size:10.5px;font-weight:600;fill:#1D7A46}.n{font-size:11.5px;font-weight:600;fill:#23272E}</style><rect width="620" height="372" fill="#FFFFFF"/><text class="t" x="16" y="24">PA × AP e o índice cardiotorácico</text><g transform="translate(22,44)"><rect width="266" height="172" rx="10" fill="none" stroke="#C7CBC4"/><text class="n" x="12" y="22">PA: de pé, tubo atrás</text><circle cx="30" cy="76" r="7" fill="#5E646B"/><path d="M38 76 L 190 46 M38 76 L190 128" stroke="#5E646B" stroke-width="1.1" stroke-dasharray="4 3"/><rect x="190" y="36" width="8" height="102" fill="#EFEFEA" stroke="#5E646B"/><ellipse cx="158" cy="88" rx="24" ry="17" fill="#E3F1F1" stroke="#0B6A72" stroke-width="1.8"/><text class="k" x="12" y="162">coração encostado no filme → tamanho real</text></g><g transform="translate(310,44)"><rect width="290" height="172" rx="10" fill="none" stroke="#C7CBC4"/><text class="n" x="12" y="22">AP: no leito, tubo à frente</text><circle cx="30" cy="76" r="7" fill="#5E646B"/><path d="M38 76 L 214 30 M38 76 L214 140" stroke="#5E646B" stroke-width="1.1" stroke-dasharray="4 3"/><rect x="214" y="24" width="8" height="122" fill="#EFEFEA" stroke="#5E646B"/><ellipse cx="112" cy="86" rx="18" ry="13" fill="#E3F1F1" stroke="#0B6A72" stroke-width="1.8"/><ellipse cx="186" cy="84" rx="30" ry="22" fill="none" stroke="#C6453D" stroke-width="1.8" stroke-dasharray="4 3"/><text class="r" x="12" y="162">coração longe do filme → projetado maior</text></g><g transform="translate(40,232)"><path d="M0 40 H250" stroke="#5E646B" stroke-width="1.4"/><path d="M0 28 V54 M250 28 V54" stroke="#5E646B" stroke-width="2"/><path d="M74 28 V54 M186 28 V54" stroke="#0B6A72" stroke-width="2"/><path d="M74 40 H186" stroke="#0B6A72" stroke-width="3"/><text class="k" x="76" y="22">maior diâmetro cardíaco</text><text class="l" x="0" y="72">maior diâmetro torácico interno</text></g><text class="n" x="330" y="258">Índice cardiotorácico = coração ÷ tórax</text><text class="k" x="330" y="280" text-anchor="start">Acima de 0,50 na PA de pé = cardiomegalia.</text><text class="k" x="330" y="294" text-anchor="start">Na AP de leito o índice não vale: a</text><text class="k" x="330" y="308" text-anchor="start">magnificação sozinha leva coração normal a</text><text class="k" x="330" y="322" text-anchor="start">ultrapassar 0,50.</text><text class="l" x="16" y="352" text-anchor="start">Diante de 'aumento da área cardíaca' num raio-x de leito, a primeira pergunta é a incidência.</text></svg>