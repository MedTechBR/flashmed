<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" role="img" aria-label="Curva de capnografia com fase de subida, platô alveolar e queda inspiratória"><style>text{font-family:Figtree,system-ui,sans-serif} .t{font-size:13px;font-weight:600;fill:#23272E}.l{font-size:11px;fill:#5E646B} .k{font-size:11px;font-weight:600;fill:#0B6A72}</style><rect width="560" height="280" fill="#FFFFFF"/><text class="t" x="16" y="24">Capnografia: as quatro fases de uma onda normal</text><g fill="none" stroke="#DDDDD5" stroke-width="1"><path d="M70 70H540"/><path d="M70 108H540"/><path d="M70 146H540"/><path d="M70 184H540"/><path d="M70 222H540"/></g><path d="M70 222 h40 c12 0 14 -100 34 -104 c22 -4 40 -6 92 -8 c30 -1 46 -2 60 -3 l0 115 h30 c12 0 14 -100 34 -104 c22 -4 40 -6 92 -8 c14 0 22 -1 28 -1" fill="none" stroke="#0B6A72" stroke-width="2.6"/><text class="k" x="120" y="104">fase de subida</text><text class="k" x="250" y="96">platô alveolar</text><text class="k" x="300" y="200">queda inspiratória</text><text class="l" x="16" y="150" transform="rotate(-90 16 150)">CO₂ expirado</text><text class="l" x="70" y="252">O valor do fim do platô é o CO₂ expirado que se lê no monitor.</text><text class="l" x="70" y="270">Traçado achatado com via aérea correta = fluxo pulmonar baixo.</text></svg>