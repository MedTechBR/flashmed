<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 318" role="img" aria-label="Curva pressão-volume com pontos de inflexão inferior e superior"><style>text{font-family:Figtree,system-ui,sans-serif} .t{font-size:13px;font-weight:600;fill:#23272E}.l{font-size:11px;fill:#5E646B} .k{font-size:11px;font-weight:600;fill:#0B6A72}</style><rect width="560" height="318" fill="#FFFFFF"/><text class="t" x="16" y="24">Curva pressão-volume: onde a PEEP e o platô precisam ficar</text><g fill="none" stroke="#DDDDD5" stroke-width="1"><path d="M70 60H520"/><path d="M70 96H520"/><path d="M70 132H520"/><path d="M70 168H520"/><path d="M70 204H520"/><path d="M70 240H520"/><path d="M70 60V240"/><path d="M145 60V240"/><path d="M220 60V240"/><path d="M295 60V240"/><path d="M370 60V240"/><path d="M445 60V240"/><path d="M520 60V240"/></g><path d="M70 236 C 120 235, 158 228, 178 208 L 362 94 C 388 78, 420 70, 460 67 C 490 65, 510 65, 520 65" fill="none" stroke="#0B6A72" stroke-width="2.6"/><circle cx="178" cy="208" r="4.5" fill="#C6453D"/><circle cx="380" cy="82" r="4.5" fill="#C6453D"/><path d="M178 208 L178 240" stroke="#C6453D" stroke-width="1.4" stroke-dasharray="4 3"/><path d="M380 82 L380 240" stroke="#C6453D" stroke-width="1.4" stroke-dasharray="4 3"/><text class="k" x="188" y="228">ponto de inflexão inferior</text><text class="k" x="390" y="104">ponto de inflexão superior</text><text class="l" x="295" y="258" text-anchor="middle">pressão de vias aéreas</text><text class="l" x="16" y="150" transform="rotate(-90 16 150)">volume</text><text class="l" x="70" y="284">PEEP abaixo do inferior: colapso e reabertura a cada ciclo.</text><text class="l" x="70" y="302">Platô acima do superior: hiperdistensão do alvéolo já aberto.</text></svg>