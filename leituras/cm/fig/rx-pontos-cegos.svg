<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 372" role="img" aria-label="As cinco áreas onde o achado se esconde"><style>text{font-family:Figtree,system-ui,sans-serif}.t{font-size:13.5px;font-weight:600;fill:#23272E}.l{font-size:10.5px;fill:#5E646B}.k{font-size:10.5px;font-weight:600;fill:#0B6A72}.r{font-size:10.5px;font-weight:600;fill:#C6453D}.a{font-size:10.5px;font-weight:600;fill:#A3730A}.v{font-size:10.5px;font-weight:600;fill:#1D7A46}.n{font-size:11.5px;font-weight:600;fill:#23272E}</style><rect width="620" height="372" fill="#FFFFFF"/><text class="t" x="16" y="24">As cinco áreas onde o achado se esconde</text><g transform="translate(24,46) scale(1.16)"><g fill="none" stroke="#5E646B" stroke-width="1.5"><path d="M30 62 q 74 -17 148 0" opacity=".32"/><path d="M32 86 q 71 -18 142 0" opacity=".32"/><path d="M34 110 q 68 -19 136 0" opacity=".32"/><path d="M36 134 q 65 -20 130 0" opacity=".32"/><path d="M38 158 q 62 -21 124 0" opacity=".32"/><path d="M40 182 q 59 -22 118 0" opacity=".32"/><path d="M105 16 C 66 20 34 54 26 104 C 21 140 20 170 23 190"/><path d="M105 16 C 144 20 176 54 184 104 C 189 140 190 170 187 190"/><path d="M23 190 C 46 212 84 216 104 192" stroke-width="2.2"/><path d="M187 196 C 166 218 128 222 106 198" stroke-width="2.2"/><path d="M105 18 V196" opacity=".25"/><path d="M98 16 V70 M112 16 V70" opacity=".45"/><path d="M105 72 L80 90 M105 72 L131 88" opacity=".45"/></g><path d="M92 118 C 88 152 94 186 106 200 C 124 212 152 208 158 196 C 150 168 142 140 136 118 C 130 100 112 96 102 102 C 95 106 93 108 92 118 Z" fill="#F0F0EB" stroke="#5E646B" stroke-width="1.8"/><g fill="none" stroke="#5E646B" stroke-width="1.4" opacity=".65"><path d="M80 90 q-10 14 -13 30"/><path d="M131 88 q9 14 12 28"/></g><ellipse cx="76" cy="48" rx="18" ry="14" fill="#A3730A" opacity=".16" stroke="#A3730A" stroke-width="1.4" stroke-dasharray="4 3"/><ellipse cx="134" cy="48" rx="18" ry="14" fill="#A3730A" opacity=".16" stroke="#A3730A" stroke-width="1.4" stroke-dasharray="4 3"/><ellipse cx="128" cy="152" rx="30" ry="36" fill="#A3730A" opacity=".16" stroke="#A3730A" stroke-width="1.4" stroke-dasharray="4 3"/><ellipse cx="60" cy="196" rx="42" ry="16" fill="#A3730A" opacity=".16" stroke="#A3730A" stroke-width="1.4" stroke-dasharray="4 3"/><ellipse cx="76" cy="102" rx="13" ry="17" fill="#A3730A" opacity=".16" stroke="#A3730A" stroke-width="1.4" stroke-dasharray="4 3"/><ellipse cx="140" cy="102" rx="13" ry="17" fill="#A3730A" opacity=".16" stroke="#A3730A" stroke-width="1.4" stroke-dasharray="4 3"/><ellipse cx="176" cy="124" rx="18" ry="46" fill="#A3730A" opacity=".16" stroke="#A3730A" stroke-width="1.4" stroke-dasharray="4 3"/></g><circle cx="306" cy="61" r="5.5" fill="#A3730A"/><text class="n" x="322" y="65">Ápices</text><text class="l" x="322" y="81" text-anchor="start">atrás da clavícula e do primeiro arco</text><circle cx="306" cy="117" r="5.5" fill="#A3730A"/><text class="n" x="322" y="121">Região retrocardíaca</text><text class="l" x="322" y="137" text-anchor="start">o coração esconde o lobo inferior</text><text class="l" x="322" y="151" text-anchor="start">esquerdo</text><circle cx="306" cy="173" r="5.5" fill="#A3730A"/><text class="n" x="322" y="177">Abaixo das cúpulas</text><text class="l" x="322" y="193" text-anchor="start">bases pulmonares, câmara gástrica, ar</text><text class="l" x="322" y="207" text-anchor="start">livre</text><circle cx="306" cy="229" r="5.5" fill="#A3730A"/><text class="n" x="322" y="233">Hilos</text><text class="l" x="322" y="249" text-anchor="start">massa e linfonodo somem no emaranhado</text><text class="l" x="322" y="263" text-anchor="start">vascular</text><circle cx="306" cy="285" r="5.5" fill="#A3730A"/><text class="n" x="322" y="289">Parede e partes moles</text><text class="l" x="322" y="305" text-anchor="start">pneumotórax fino, mama, enfisema de</text><text class="l" x="322" y="319" text-anchor="start">subcutâneo</text><text class="l" x="16" y="350" text-anchor="start">Boa parte dos cânceres de pulmão perdidos em radiografia estava numa destas cinco áreas.</text><text class="l" x="16" y="364" text-anchor="start">Revisá-las é parte do E de 'esquecidos'.</text></svg>