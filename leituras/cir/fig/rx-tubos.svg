<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 372" role="img" aria-label="Tubos e cateteres: onde a ponta tem de estar"><style>text{font-family:Figtree,system-ui,sans-serif}.t{font-size:13.5px;font-weight:600;fill:#23272E}.l{font-size:10.5px;fill:#5E646B}.k{font-size:10.5px;font-weight:600;fill:#0B6A72}.r{font-size:10.5px;font-weight:600;fill:#C6453D}.a{font-size:10.5px;font-weight:600;fill:#A3730A}.v{font-size:10.5px;font-weight:600;fill:#1D7A46}.n{font-size:11.5px;font-weight:600;fill:#23272E}</style><rect width="620" height="372" fill="#FFFFFF"/><text class="t" x="16" y="24">Tubos e cateteres: onde a ponta tem de estar</text><g transform="translate(24,46) scale(1.2)"><g fill="none" stroke="#5E646B" stroke-width="1.5"><path d="M30 62 q 74 -17 148 0" opacity=".32"/><path d="M32 86 q 71 -18 142 0" opacity=".32"/><path d="M34 110 q 68 -19 136 0" opacity=".32"/><path d="M36 134 q 65 -20 130 0" opacity=".32"/><path d="M38 158 q 62 -21 124 0" opacity=".32"/><path d="M40 182 q 59 -22 118 0" opacity=".32"/><path d="M105 16 C 66 20 34 54 26 104 C 21 140 20 170 23 190"/><path d="M105 16 C 144 20 176 54 184 104 C 189 140 190 170 187 190"/><path d="M23 190 C 46 212 84 216 104 192" stroke-width="2.2"/><path d="M187 196 C 166 218 128 222 106 198" stroke-width="2.2"/><path d="M105 18 V196" opacity=".25"/><path d="M98 16 V70 M112 16 V70" opacity=".45"/><path d="M105 72 L80 90 M105 72 L131 88" opacity=".45"/></g><path d="M92 118 C 88 152 94 186 106 200 C 124 212 152 208 158 196 C 150 168 142 140 136 118 C 130 100 112 96 102 102 C 95 106 93 108 92 118 Z" fill="#F0F0EB" stroke="#5E646B" stroke-width="1.8"/><g fill="none" stroke="#5E646B" stroke-width="1.4" opacity=".65"><path d="M80 90 q-10 14 -13 30"/><path d="M131 88 q9 14 12 28"/></g><path d="M105 16 V62" stroke="#0B6A72" stroke-width="3.6"/><path d="M100 62 h10" stroke="#0B6A72" stroke-width="3.6"/><path d="M113 16 C 116 70 112 150 110 198 C 112 216 128 230 146 234" stroke="#A3730A" stroke-width="2.6" fill="none"/><circle cx="146" cy="234" r="3.6" fill="#A3730A"/><path d="M36 36 C 60 40 80 46 88 58 C 91 72 91 92 90 108" stroke="#1D7A46" stroke-width="2.6" fill="none"/><circle cx="90" cy="110" r="3.6" fill="#1D7A46"/><path d="M208 154 L 188 146 C 178 120 164 82 142 52" stroke="#6B4FA0" stroke-width="3.4" fill="none"/><circle cx="180" cy="122" r="1.3" fill="#FFFFFF"/><circle cx="170" cy="96" r="1.3" fill="#FFFFFF"/><circle cx="158" cy="72" r="1.3" fill="#FFFFFF"/><circle cx="142" cy="52" r="3.6" fill="#6B4FA0"/></g><path d="M300 57 h24" stroke="#0B6A72" stroke-width="3.6"/><text class="n" x="332" y="61">Tubo orotraqueal</text><text class="l" x="332" y="78" text-anchor="start">ponta a 5 ± 2 cm da carina, com o</text><text class="l" x="332" y="92" text-anchor="start">pescoço em posição neutra; flexão e</text><text class="l" x="332" y="106" text-anchor="start">extensão movem a ponta cerca de 2 cm</text><path d="M300 127 h24" stroke="#A3730A" stroke-width="3.6"/><text class="n" x="332" y="131">Sonda nasogástrica</text><text class="l" x="332" y="148" text-anchor="start">desce na linha média, corta a carina,</text><text class="l" x="332" y="162" text-anchor="start">cruza o diafragma e a ponta fica abaixo</text><text class="l" x="332" y="176" text-anchor="start">da cúpula esquerda</text><path d="M300 197 h24" stroke="#1D7A46" stroke-width="3.6"/><text class="n" x="332" y="201">Cateter venoso central</text><text class="l" x="332" y="218" text-anchor="start">ponta no terço distal da veia cava</text><text class="l" x="332" y="232" text-anchor="start">superior, perto da junção com o átrio</text><text class="l" x="332" y="246" text-anchor="start">direito</text><path d="M300 267 h24" stroke="#6B4FA0" stroke-width="3.6"/><text class="n" x="332" y="271">Dreno de tórax</text><text class="l" x="332" y="288" text-anchor="start">no pneumotórax, ponta no ápice,</text><text class="l" x="332" y="302" text-anchor="start">anterior; todos os orifícios laterais</text><text class="l" x="332" y="316" text-anchor="start">dentro da pleura</text><text class="l" x="16" y="352" text-anchor="start">A radiografia pós-procedimento responde a duas perguntas: o dispositivo está onde deveria e o</text><text class="l" x="16" y="366" text-anchor="start">procedimento causou dano?</text></svg>