<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 372" role="img" aria-label="Ar livre sob o diafragma"><style>text{font-family:Figtree,system-ui,sans-serif}.t{font-size:13.5px;font-weight:600;fill:#23272E}.l{font-size:10.5px;fill:#5E646B}.k{font-size:10.5px;font-weight:600;fill:#0B6A72}.r{font-size:10.5px;font-weight:600;fill:#C6453D}.a{font-size:10.5px;font-weight:600;fill:#A3730A}.v{font-size:10.5px;font-weight:600;fill:#1D7A46}.n{font-size:11.5px;font-weight:600;fill:#23272E}</style><rect width="620" height="372" fill="#FFFFFF"/><text class="t" x="16" y="24">Ar livre sob o diafragma</text><g transform="translate(40,46) scale(1.16)"><g fill="none" stroke="#5E646B" stroke-width="1.5"><path d="M30 62 q 74 -17 148 0" opacity=".32"/><path d="M32 86 q 71 -18 142 0" opacity=".32"/><path d="M34 110 q 68 -19 136 0" opacity=".32"/><path d="M36 134 q 65 -20 130 0" opacity=".32"/><path d="M38 158 q 62 -21 124 0" opacity=".32"/><path d="M40 182 q 59 -22 118 0" opacity=".32"/><path d="M105 16 C 66 20 34 54 26 104 C 21 140 20 170 23 190"/><path d="M105 16 C 144 20 176 54 184 104 C 189 140 190 170 187 190"/><path d="M23 190 C 46 212 84 216 104 192" stroke-width="2.2"/><path d="M187 196 C 166 218 128 222 106 198" stroke-width="2.2"/><path d="M105 18 V196" opacity=".25"/><path d="M98 16 V70 M112 16 V70" opacity=".45"/><path d="M105 72 L80 90 M105 72 L131 88" opacity=".45"/></g><path d="M92 118 C 88 152 94 186 106 200 C 124 212 152 208 158 196 C 150 168 142 140 136 118 C 130 100 112 96 102 102 C 95 106 93 108 92 118 Z" fill="#F0F0EB" stroke="#5E646B" stroke-width="1.8"/><g fill="none" stroke="#5E646B" stroke-width="1.4" opacity=".65"><path d="M80 90 q-10 14 -13 30"/><path d="M131 88 q9 14 12 28"/></g><path d="M23 190 C 46 212 84 216 104 192 L 102 204 C 80 224 44 220 22 200 Z" fill="#C6453D" opacity=".22"/><path d="M22 200 C 44 220 80 224 102 204" fill="none" stroke="#C6453D" stroke-width="2.6"/><text class="r" x="34" y="240">ar livre</text></g><text class="n" x="316" y="76">A incidência decide</text><text class="l" x="316" y="98" text-anchor="start">De pé, ou em decúbito lateral esquerdo com</text><text class="l" x="316" y="112" text-anchor="start">raio horizontal, o ar sobe e se desenha como</text><text class="l" x="316" y="126" text-anchor="start">faixa fina sob o diafragma. Deitado, esse</text><text class="l" x="316" y="140" text-anchor="start">mesmo ar fica na frente das alças e some.</text><text class="k" x="316" y="168" text-anchor="start">Sentar o paciente por 5 a 10 minutos antes</text><text class="k" x="316" y="182" text-anchor="start">do disparo.</text><text class="a" x="316" y="212">Não confundir com o sinal de Chilaiditi:</text><text class="l" x="316" y="230" text-anchor="start">alça de cólon interposta entre fígado e</text><text class="l" x="316" y="244" text-anchor="start">diafragma, com haustrações visíveis dentro</text><text class="l" x="316" y="258" text-anchor="start">do ar.</text><text class="l" x="16" y="344" text-anchor="start">Ausência de ar livre na radiografia não exclui perfuração; a tomografia é bem mais sensível.</text></svg>