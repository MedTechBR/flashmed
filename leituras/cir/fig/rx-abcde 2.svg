<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 372" role="img" aria-label="Leitura sistemática: A · B · C · D · E"><style>text{font-family:Figtree,system-ui,sans-serif}.t{font-size:13.5px;font-weight:600;fill:#23272E}.l{font-size:10.5px;fill:#5E646B}.k{font-size:10.5px;font-weight:600;fill:#0B6A72}.r{font-size:10.5px;font-weight:600;fill:#C6453D}.a{font-size:10.5px;font-weight:600;fill:#A3730A}.v{font-size:10.5px;font-weight:600;fill:#1D7A46}.n{font-size:11.5px;font-weight:600;fill:#23272E}</style><rect width="620" height="372" fill="#FFFFFF"/><text class="t" x="16" y="24">Leitura sistemática: A · B · C · D · E</text><g transform="translate(22,44) scale(1.16)"><g fill="none" stroke="#5E646B" stroke-width="1.5"><path d="M30 62 q 74 -17 148 0" opacity=".32"/><path d="M32 86 q 71 -18 142 0" opacity=".32"/><path d="M34 110 q 68 -19 136 0" opacity=".32"/><path d="M36 134 q 65 -20 130 0" opacity=".32"/><path d="M38 158 q 62 -21 124 0" opacity=".32"/><path d="M40 182 q 59 -22 118 0" opacity=".32"/><path d="M105 16 C 66 20 34 54 26 104 C 21 140 20 170 23 190"/><path d="M105 16 C 144 20 176 54 184 104 C 189 140 190 170 187 190"/><path d="M23 190 C 46 212 84 216 104 192" stroke-width="2.2"/><path d="M187 196 C 166 218 128 222 106 198" stroke-width="2.2"/><path d="M105 18 V196" opacity=".25"/><path d="M98 16 V70 M112 16 V70" opacity=".45"/><path d="M105 72 L80 90 M105 72 L131 88" opacity=".45"/></g><path d="M92 118 C 88 152 94 186 106 200 C 124 212 152 208 158 196 C 150 168 142 140 136 118 C 130 100 112 96 102 102 C 95 106 93 108 92 118 Z" fill="#F0F0EB" stroke="#5E646B" stroke-width="1.8"/><g fill="none" stroke="#5E646B" stroke-width="1.4" opacity=".65"><path d="M80 90 q-10 14 -13 30"/><path d="M131 88 q9 14 12 28"/></g><path d="M105 18 V70" stroke="#0B6A72" stroke-width="2.6" fill="none"/><ellipse cx="105" cy="126" rx="76" ry="62" fill="none" stroke="#0B6A72" stroke-width="1.4" stroke-dasharray="5 4" opacity=".75"/><circle cx="27" cy="192" r="9" fill="none" stroke="#0B6A72" stroke-width="1.8"/><circle cx="184" cy="198" r="9" fill="none" stroke="#0B6A72" stroke-width="1.8"/></g><circle cx="300" cy="59" r="13.5" fill="#E3F1F1" stroke="#0B6A72" stroke-width="1.4"/><text x="300" y="63" text-anchor="middle" font-size="13" font-weight="700" fill="#0B6A72">A</text><text class="n" x="326" y="56">Vias aéreas</text><text class="l" x="326" y="72" text-anchor="start">traqueia central, carina,</text><text class="l" x="326" y="86" text-anchor="start">brônquios-fonte</text><circle cx="300" cy="117" r="13.5" fill="#E3F1F1" stroke="#0B6A72" stroke-width="1.4"/><text x="300" y="121" text-anchor="middle" font-size="13" font-weight="700" fill="#0B6A72">B</text><text class="n" x="326" y="114">Pulmões</text><text class="l" x="326" y="130" text-anchor="start">os dois campos, zona a zona, até os</text><text class="l" x="326" y="144" text-anchor="start">ápices</text><circle cx="300" cy="175" r="13.5" fill="#E3F1F1" stroke="#0B6A72" stroke-width="1.4"/><text x="300" y="179" text-anchor="middle" font-size="13" font-weight="700" fill="#0B6A72">C</text><text class="n" x="326" y="172">Coração e mediastino</text><text class="l" x="326" y="188" text-anchor="start">índice cardiotorácico, bordas, hilos,</text><text class="l" x="326" y="202" text-anchor="start">aorta</text><circle cx="300" cy="233" r="13.5" fill="#E3F1F1" stroke="#0B6A72" stroke-width="1.4"/><text x="300" y="237" text-anchor="middle" font-size="13" font-weight="700" fill="#0B6A72">D</text><text class="n" x="326" y="230">Diafragma</text><text class="l" x="326" y="246" text-anchor="start">cúpulas, seios costofrênicos, ar sob o</text><text class="l" x="326" y="260" text-anchor="start">diafragma</text><circle cx="300" cy="291" r="13.5" fill="#E3F1F1" stroke="#0B6A72" stroke-width="1.4"/><text x="300" y="295" text-anchor="middle" font-size="13" font-weight="700" fill="#0B6A72">E</text><text class="n" x="326" y="288">Esqueleto e esquecidos</text><text class="l" x="326" y="304" text-anchor="start">arcos, coluna, partes moles, tubos,</text><text class="l" x="326" y="318" text-anchor="start">cateteres</text><text class="l" x="16" y="352" text-anchor="start">A ordem existe para o olho não parar no primeiro achado e deixar de varrer o resto do filme.</text></svg>