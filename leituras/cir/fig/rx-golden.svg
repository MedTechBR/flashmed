<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 372" role="img" aria-label="Sinal do S de Golden"><style>text{font-family:Figtree,system-ui,sans-serif}.t{font-size:13.5px;font-weight:600;fill:#23272E}.l{font-size:10.5px;fill:#5E646B}.k{font-size:10.5px;font-weight:600;fill:#0B6A72}.r{font-size:10.5px;font-weight:600;fill:#C6453D}.a{font-size:10.5px;font-weight:600;fill:#A3730A}.v{font-size:10.5px;font-weight:600;fill:#1D7A46}.n{font-size:11.5px;font-weight:600;fill:#23272E}</style><rect width="620" height="372" fill="#FFFFFF"/><text class="t" x="16" y="24">Sinal do S de Golden</text><g transform="translate(30,46) scale(1.2)"><g fill="none" stroke="#5E646B" stroke-width="1.5"><path d="M30 62 q 74 -17 148 0" opacity=".32"/><path d="M32 86 q 71 -18 142 0" opacity=".32"/><path d="M34 110 q 68 -19 136 0" opacity=".32"/><path d="M36 134 q 65 -20 130 0" opacity=".32"/><path d="M38 158 q 62 -21 124 0" opacity=".32"/><path d="M40 182 q 59 -22 118 0" opacity=".32"/><path d="M105 16 C 66 20 34 54 26 104 C 21 140 20 170 23 190"/><path d="M105 16 C 144 20 176 54 184 104 C 189 140 190 170 187 190"/><path d="M23 190 C 46 212 84 216 104 192" stroke-width="2.2"/><path d="M187 196 C 166 218 128 222 106 198" stroke-width="2.2"/><path d="M105 18 V196" opacity=".25"/><path d="M98 16 V70 M112 16 V70" opacity=".45"/><path d="M105 72 L80 90 M105 72 L131 88" opacity=".45"/></g><path d="M92 118 C 88 152 94 186 106 200 C 124 212 152 208 158 196 C 150 168 142 140 136 118 C 130 100 112 96 102 102 C 95 106 93 108 92 118 Z" fill="#F0F0EB" stroke="#5E646B" stroke-width="1.8"/><g fill="none" stroke="#5E646B" stroke-width="1.4" opacity=".65"><path d="M80 90 q-10 14 -13 30"/><path d="M131 88 q9 14 12 28"/></g><path d="M28 100 C 40 84 56 82 68 94 C 78 104 88 106 100 72 L 97 20 C 66 22 38 54 28 100 Z" fill="#0B6A72" opacity=".28"/><path d="M28 100 C 40 84 56 82 68 94 C 78 104 88 106 100 72" fill="none" stroke="#C6453D" stroke-width="3.4"/><circle cx="92" cy="86" r="14" fill="#EFEFEA" stroke="#C6453D" stroke-width="2.4"/><text class="r" x="112" y="90">massa</text><text class="l" x="58" y="50" style="fill:#23272E">lobo</text><text class="l" x="45" y="62" style="fill:#23272E">colapsado</text></g><text class="n" x="330" y="86">A cissura do lobo colapsado faz um S,</text><text class="n" x="330" y="104">não uma linha reta</text><text class="l" x="330" y="130" text-anchor="start">A parte côncava é o colapso puxando; a</text><text class="l" x="330" y="144" text-anchor="start">parte convexa é a massa que obstrui o</text><text class="l" x="330" y="158" text-anchor="start">brônquio e não deixa o lobo colabar até o</text><text class="l" x="330" y="172" text-anchor="start">fim.</text><text class="k" x="330" y="190" text-anchor="start">Atelectasia lobar em adulto fumante pede</text><text class="k" x="330" y="204" text-anchor="start">tomografia e broncoscopia, não</text><text class="k" x="330" y="218" text-anchor="start">fisioterapia respiratória.</text><text class="l" x="16" y="344" text-anchor="start">Descrito por Ross Golden em 1925 para o colapso do lobo superior direito; o raciocínio vale para</text><text class="l" x="16" y="358" text-anchor="start">qualquer atelectasia com massa central.</text></svg>