ath d="M138 122 C 158 124 174 136 182 150 C 178 164 168 176 156 184 C 150 162 144 142 138 122 Z" fill="#0B6A72" fill-opacity=".14" stroke="#0B6A72" stroke-opacity=".7" stroke-width="1"/><path d="M176 160 L 196 170" stroke="#5E646B" stroke-width=".8"/><text class="k" x="198" y="176">língula</text><text class="k" x="42" y="74">LSD</text><text class="k" x="34" y="134">LM</text><text class="k" x="36" y="186">LID</text><text class="k" x="150" y="78">LSE</text><text class="k" x="165" y="194">LIE</text><text class="l" x="14" y="240">frente (PA)</text></g><g transform="translate(316,46) scale(1.14)"><path d="M34 16 C 10 44 6 106 12 158 C 16 184 22 192 28 196" fill="none" stroke="#5E646B" stroke-width="1.5"/><path d="M34 16 C 102 22 148 64 158 124 C 162 158 158 180 152 192" fill="none" stroke="#5E646B" stroke-width="1.5"/><path d="M28 196 C 64 210 122 208 152 192" fill="none" stroke="#5E646B" stroke-width="2.2"/><path d="M30 62 C 74 100 114 146 148 180" stroke="#0B6A72" stroke-width="2" stroke-dasharray="5 4" fill="none"/><path d="M82 110 C 106 108 128 112 154 124" stroke="#0B6A72" stroke-width="2" stroke-dasharray="5 4" fill="none"/><text class="k" x="46" y="56">superior</text><text class="k" x="102" y="104">médio</text><text class="k" x="48" y="170">inferior</text><text class="l" x="10" y="232">perfil direito</text></g><text class="l" x="16" y="344" text-anchor="start">A cissura horizontal só existe à direita. É por isso que o lobo médio é a chave do sinal da</text><text class="l" x="16" y="358" text-anchor="start">silhueta: é o único que encosta na borda direita do coração.</text></svg>