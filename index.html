      <td><span class="pilula ${pct(a.ok,a.n)>=70?"ok":"er"}">${pct(a.ok,a.n)}%</span></td></tr>`).join("")}
  </table></div></div>
  <div id="revisao"></div>`;
  $("#btNovo").onclick=()=>{ST.simativo=null;salva("simativo",null);pintaSimulado()};
  $("#btRevisar").onclick=()=>{
    $("#revisao").innerHTML=s.qs.map((ch,k)=>{const q=QIDX.get(ch);if(!q)return "";const r=s.res[ch],ok=acerta(q,r);
      return `<div class="cx"><div class="linha" style="gap:6px">
        <span class="pilula ${ok?"ok":"er"}">${k+1}. ${ok?"acertou":r===undefined?"em branco":"errou"}</span>
        <span class="pilula b">${esc(NOME[q.tema]||q.tema)}</span>
        <button class="simSinal" data-ch="${esc(ch)}" style="margin-left:auto"></button></div>
       <p class="enun">${esc(q.q)}</p>
       ${ordemAlts(q).map((j,p)=>`<div class="alt${j===q.gab?" certa":(j===r?" errada":"")}">
         <span class="let">${LETRAS[p]}</span><span>${esc(q.alts[j])}</span></div>`).join("")}
       <div class="coment">${esc(q.coment)}<div class="base">Âncora: ${esc(q.base)}${q.fonte?" · "+esc(rotuloFonte(q)):""}</div></div></div>`}).join("");
    $$("#revisao .simSinal").forEach(b=>bandeira(b,QIDX.get(b.dataset.ch)));
    $("#btRevisar").disabled=true;
  };
}
</script>
<script>
/* ================= aba PRÁTICA (estações da 2ª fase) ================= */
function pintaPratica(){
  const ativo=ST.cfg.estacao&&PRATICA.find(e=>e.id===ST.cfg.estacao);
  if(ativo)return pintaEstacao(ativo);
  const feitas=Object.keys(ST.treino).length;
  const fps=leAreas(ST.cfg.fps,ST.cfg.fp), sfp=new Set(fps);
  const lista=fps.length?PRATICA.filter(e=>sfp.has(e.area)):PRATICA;
  $("#sec-pratica").innerHTML=`
  <div class="cx">
   <h2 style="margin:0 0 6px">Estações de proficiência clínica</h2>
   <p class="mini">Formato do edital: 2 estações de 10 minutos, entrega sequencial dos dados, avaliação por Conhecimento, Habilidade e Atitude, 5 pontos por estação e corte de 7 nos 10 possíveis. Escreva sua conduta sem olhar; só depois abra o espelho e marque item a item o que você realmente disse.</p>
   <div class="grade2" style="margin-top:12px">
    <div class="kpi"><b>${feitas}</b><span>estações treinadas</span></div>
    <div class="kpi"><b>${PRATICA.length}</b><span>disponíveis</span></div>
    <div class="kpi"><b>${notaMediaEstacoes()}</b><span>nota média (0 a 5)</span></div>
   </div>
   <div class="linha" style="margin-top:12px">
    <label class="cmp">Área<button type="button" id="pArea"></button></label>
    ${fps.length?`<button class="bt sec mini" id="pLimpa" style="align-self:flex-end">limpar</button>`:""}
    <span class="mini" style="margin-left:auto;align-self:flex-end">${lista.length} de ${PRATICA.length}</span>
   </div>
  </div>
  <div class="listaP">${lista.map(e=>{const t=ST.treino[e.id];
    return `<div class="cx"><div class="linha" style="gap:6px">
      <span class="pilula b">${esc(NOME[e.area]||e.area)}</span>
      <span class="pilula">${esc(NCEN[e.cenario]||"")}</span>
      <span class="pilula">${e.tempo} min</span>
      ${t?`<span class="pilula ${t.nota>=3.5?"ok":"er"}">nota ${t.nota.toFixed(1)}</span>`:""}
     </div>
     <h3 style="margin:9px 0 4px">${esc(e.titulo)}</h3>
     <p class="mini">${esc(e.abertura.slice(0,150))}…</p>
     <button class="bt mini" data-est="${e.id}" style="margin-top:9px">${t?"treinar de novo":"iniciar estação"}</button>
    </div>`}).join("")}</div>`;
  const poeFps=ids=>{const a=ordAreas(ids);ST.cfg.fps=a;ST.cfg.fp=a[0]||"";salva("cfg",ST.cfg);pintaPratica()};
  seletorAreas($("#pArea"),{
    opcoes:TAX.filter(x=>PRATICA.some(e=>e.area===x.id)).map(x=>({id:x.id,nome:x.nome,n:PRATICA.filter(e=>e.area===x.id).length})),
    selecionados:fps, unidade:["estação","estações"],
    aoMudar:poeFps});
  if($("#pLimpa"))$("#pLimpa").onclick=()=>poeFps([]);
  $$("[data-est]").forEach(b=>b.onclick=()=>{ST.cfg.estacao=b.dataset.est;ST.cfg.etapa=0;ST.cfg.iniEst=Date.now();salva("cfg",ST.cfg);pintaPratica()});
}
function notaMediaEstacoes(){const v=Object.values(ST.treino);if(!v.length)return "—";
  return (v.reduce((s,t)=>s+t.nota,0)/v.length).toFixed(1)}
function pintaEstacao(e){
  const et=ST.cfg.etapa||0, mostrando=Math.min(et,e.etapas.length-1);
  const acabou=et>=e.etapas.length;
  const rest=Math.max(0,e.tempo*60-Math.floor((Date.now()-(ST.cfg.iniEst||Date.now()))/1000));
  $("#sec-pratica").innerHTML=`
  <div class="cx">
   <div class="linha">
    <span class="crono" id="cronoEst">${String(Math.floor(rest/60)).padStart(2,"0")}:${String(rest%60).padStart(2,"0")}</span>
    <span class="mini">${esc(e.titulo)}</span>
    <button class="bt sec mini" id="sairEst" style="margin-left:auto">sair</button>
   </div>
  </div>
  <div class="cx">
   <b>Cenário</b>
   <p class="enun" style="margin-top:6px">${esc(e.abertura)}</p>
   ${e.etapas.slice(0,mostrando+1).map((p,k)=>`
     <div class="coment" style="margin-bottom:10px">
      <b>Etapa ${p.n}.</b> ${esc(p.tarefa)}
      ${k<et?`<div class="base">${esc(p.entrega)}</div>`:""}
     </div>`).join("")}
   ${!acabou?`<button class="bt" id="btEtapa">Cumpri esta etapa: receber os dados</button>`:
     `<label class="cmp" style="margin-top:10px">O que você disse/fez na estação (escreva antes de abrir o espelho)
       <textarea id="txtEst" placeholder="Registre sua conduta como se estivesse falando com o examinador.">${esc((ST.treino[e.id]||{}).texto||"")}</textarea></label>
      <button class="bt" id="btEspelho" style="margin-top:10px">Abrir o espelho de correção</button>`}
  </div>
  <div id="espelho"></div>`;
  $("#sairEst").onclick=()=>{ST.cfg.estacao=null;salva("cfg",ST.cfg);pintaPratica()};
  const cr=setInterval(()=>{const el=$("#cronoEst");if(!el)return clearInterval(cr);
    const r=Math.max(0,e.tempo*60-Math.floor((Date.now()-(ST.cfg.iniEst||Date.now()))/1000));
    el.textContent=`${String(Math.floor(r/60)).padStart(2,"0")}:${String(r%60).padStart(2,"0")}`;
    if(r===0){clearInterval(cr);UI.banner("avi","Os 10 minutos acabaram. Na prova, o sinal soa aqui.")}},1000);
  if($("#btEtapa"))$("#btEtapa").onclick=()=>{ST.cfg.etapa=et+1;salva("cfg",ST.cfg);clearInterval(cr);pintaPratica()};
  if($("#btEspelho"))$("#btEspelho").onclick=()=>{
    const texto=$("#txtEst").value.trim();
    if(texto.length<30)return UI.banner("avi","Escreva sua conduta antes de abrir o espelho. Abrir primeiro contamina a autoavaliação.");
    ST.treino[e.id]={texto,nota:0,marcados:[],quando:new Date().toISOString()};salva("treino",ST.treino);
    clearInterval(cr);desenhaEspelho(e);
  };
}
function desenhaEspelho(e){
  const t=ST.treino[e.id];
  const teto=e.espelho.reduce((s,i)=>s+i.peso,0);
  const eixo={C:"Conhecimento",H:"Habilidade",A:"Atitude"};
  $("#espelho").innerHTML=`
   <div class="cx">
    <h3 style="margin:0 0 4px">Espelho de correção</h3>
    <p class="mini">Marque apenas o que você realmente escreveu ou disse, não o que você "sabia". A nota sai da razão entre os pesos marcados e o total de ${teto.toFixed(1)} pontos.</p>
    ${["C","H","A"].map(x=>{const itens=e.espelho.filter(i=>i.eixo===x);if(!itens.length)return "";
      return `<h4 style="margin:14px 0 6px">${eixo[x]}</h4>`+
        itens.map(i=>{const k=e.espelho.indexOf(i);
          return `<label class="alt" style="cursor:pointer"><input type="checkbox" data-k="${k}" ${t.marcados.includes(k)?"checked":""} style="min-height:auto;margin-top:3px">
           <span>${esc(i.item)} <span class="pilula">${i.peso.toFixed(1)}</span></span></label>`}).join("")}).join("")}
    <hr>
    <div class="linha"><span class="crono" id="notaEst">0.0</span><span class="mini">de ${teto.toFixed(1)} pontos</span>
     <button class="bt" id="btFecharEst" style="margin-left:auto">Salvar e voltar</button></div>
    <p class="mini" style="margin-top:10px">Na prova real são 2 estações: soma-se as duas e o corte é 7 pontos em 10.</p>
   </div>`;
  const recalcula=()=>{
    const ks=$$("#espelho input:checked").map(i=>+i.dataset.k);
    const nota=ks.reduce((s,k)=>s+e.espelho[k].peso,0);
    $("#notaEst").textContent=nota.toFixed(1);
    ST.treino[e.id]={...ST.treino[e.id],nota,marcados:ks};salva("treino",ST.treino);
  };
  $$("#espelho input").forEach(i=>i.onchange=recalcula);recalcula();
  $("#btFecharEst").onclick=()=>{ST.cfg.estacao=null;salva("cfg",ST.cfg);atividade(3);pintaPratica()};
}

/* ================= aba LEITURAS ================= */
function pintaLeituras(){
  const aberta=ST.cfg.lendo;
  if(aberta){
    const it=LEITURAS.find(l=>l.f===aberta);
    /* O sumário sai de dentro do texto e vira coluna: no computador ele acompanha a leitura, em
       vez de ocupar meia tela na abertura e nunca mais aparecer. Os cabeçalhos já estão indexados
       em IDXL — o mesmo dado que alimenta a busca global. Os controles viram barra fina: eram uma
       caixa com borda e sombra disputando atenção com o título do capítulo. */
    const ixA=(typeof IDXL!=="undefined")?IDXL.find(x=>x.f===aberta):null;
    const sumario=(ixA&&ixA.h&&ixA.h.length>2)?`<nav class="sumarioL" id="sumarioL">
       <b>Sumário</b>
       <ol>${ixA.h.map((h,i)=>`<li><a href="#${esc(h.id)}" data-sec="${esc(h.id)}">${esc(h.t)}</a></li>`).join("")}</ol>
     </nav>`:`<div></div>`;
    $("#sec-leituras").innerHTML=`
     ${sumario}
     <div class="leituraCol">
      <div class="barraL">
       <button class="bt sec mini" id="fecharL">voltar</button>
       <span class="tituloL">${esc(it?it.t:"")}</span>
       <button class="bt sec mini" id="discordoL">Discordo</button>
       <button class="bt sec mini" id="marcaL">${ST.lidas[aberta]?'<i class="ti ti-check"></i> lida':'marcar como lida'}</button>
      </div>
      <iframe class="quadro" id="quadroLeitura" src="leituras/${aberta.split("/").map(encodeURIComponent).join("/")}?tema=${temaEfetivo()}&embutida=1${ST.cfg.secao?"#"+encodeURIComponent(ST.cfg.secao):""}" title="${esc(it?it.t:"leitura")}"></iframe>
     </div>`;
    $$("#sumarioL a").forEach(a=>a.onclick=e=>{
      e.preventDefault();
      const q=$("#quadroLeitura");
      q.contentWindow.postMessage({cm:"ir",id:a.dataset.sec},"*");
    });
    /* Quem decide se o sumário de dentro some é a coluna lateral estar VISÍVEL, não a página
       estar embutida: entre 700 e 900 px a coluna não cabe, e esconder os dois deixaria a
       leitura sem sumário nenhum. O app avisa, e reavalia a cada resize. */
    const avisaSumario=()=>{
      const q=$("#quadroLeitura"); if(!q||!q.contentWindow)return;
      const nav=$("#sumarioL");
      const lateral=!!nav&&getComputedStyle(nav).display!=="none";
      q.contentWindow.postMessage({cm:"sumario",lateral},"*");
    };
    $("#quadroLeitura").addEventListener("load",avisaSumario);
    addEventListener("resize",avisaSumario);
    ST.cfg.secao=null;
    document.body.classList.add("lendo");
    ajustaQuadro();addEventListener("resize",ajustaQuadro);
    $("#fecharL").onclick=()=>{ST.cfg.lendo=null;salva("cfg",ST.cfg);document.body.classList.remove("lendo");pintaLeituras()};
    $("#discordoL").onclick=()=>abreContestacao(contextoLeitura(aberta));
    $("#marcaL").onclick=()=>{ST.lidas[aberta]=!ST.lidas[aberta];if(!ST.lidas[aberta])delete ST.lidas[aberta];
      salva("lidas",ST.lidas);atividade(2);pintaLeituras()};
    return;
  }
  document.body.classList.remove("lendo");
  const fl=ST.cfg.fl||(ST.cfg.fl={area:"",areas:[],busca:"",so:""});
  const fla=leAreas(fl.areas,fl.area), sfl=new Set(fla);
  const todas=LEITURAS.filter(l=>l.f);
  // areas que realmente tem leitura, na ordem de peso do edital
  const comLeitura=TAX.filter(t=>todas.some(l=>l.area===t.id));
  const termo=(fl.busca||"").trim().toLowerCase();
  const casa=(l,sa=sfl)=>{
    if(fl.gr && GDE[l.area]!==fl.gr) return false;
    if(sa.size && !sa.has(l.area)) return false;
    if(fl.so==="naolidas" && ST.lidas[l.f]) return false;
    if(fl.so==="lidas" && !ST.lidas[l.f]) return false;
    if(termo){
      const alvo=`${l.t} ${l.s} ${l.tipo||""} ${NOME[l.area]||""}`.toLowerCase();
      if(!alvo.includes(termo)) return false;
    }
    return true;
  };
  const vis=todas.filter(l=>casa(l));
  const minVis=vis.reduce((s,l)=>s+(l.min||0),0);
  const lidasVis=vis.filter(l=>ST.lidas[l.f]).length;
  const filtrando=!!(fla.length||termo||fl.so||fl.gr);
  // com filtro ativo, some com os separadores de secao e mostra lista corrida
  const lista = filtrando
    ? vis.map(cartaoLeitura).join("")
    : LEITURAS.map(l=>l.grupo
        ? `<h3 class="grupo" style="margin:20px 0 8px">${esc(l.grupo)}</h3>`
        : cartaoLeitura(l)).join("");
  const emCurso=Object.keys(ST.prog).filter(f=>!ST.lidas[f]&&ST.prog[f]>0&&ST.prog[f]<95)
    .map(f=>({f,l:LEITURAS.find(x=>x.f===f)})).filter(x=>x.l).sort((a,b)=>ST.prog[b.f]-ST.prog[a.f]).slice(0,3);
  const ab=!!(ST.cfg.fAb||{}).l;
  $("#sec-leituras").innerHTML=LEITURAS.length?`
  <div class="cx filtros filtroL${ab?" aberto":""}" data-fk="l">
   <h2 style="margin:0 0 10px">Leituras</h2>
   <input id="lBusca" type="search" placeholder="Buscar tema, diretriz, palavra do resumo…" value="${esc(fl.busca||"")}" style="width:100%">
   <div class="chipsG" style="margin-top:10px"><button type="button" class="chipG${fl.gr?"":" on"}" data-lgr="">Todas</button>
    ${GRANDES.filter(g=>todas.some(l=>GDE[l.area]===g.id)).map(g=>`<button type="button" class="chipG${fl.gr===g.id?" on":""}" data-lgr="${g.id}" style="--cg:${g.cor}"><i class="ti ti-${g.ic}" aria-hidden="true"></i>${esc(g.curto)}<small>${todas.filter(l=>GDE[l.area]===g.id).length}</small></button>`).join("")}</div>
   <button class="fToggle" type="button" aria-expanded="${ab}" style="margin-top:8px"><i class="ti ti-adjustments-horizontal"></i>Filtros<span class="resumo">${esc(nomeAreas(fla,"todas as áreas"))}${fl.so?" · "+(fl.so==="lidas"?"lidas":"não lidas"):""}</span><i class="ti ti-chevron-down seta"></i></button>
   <div class="linha fCorpo">
    <label class="cmp">Área<button type="button" id="lArea"></button></label>
    <label class="cmp">Mostrar<select id="lSo">
      <option value=""${!fl.so?" selected":""}>todas</option>
      <option value="naolidas"${fl.so==="naolidas"?" selected":""}>ainda não lidas</option>
      <option value="lidas"${fl.so==="lidas"?" selected":""}>já lidas</option>
    </select></label>
    ${filtrando?`<button class="bt sec mini" id="lLimpa" style="align-self:flex-end">limpar</button>`:""}
   </div>
   <div class="mini" style="margin-top:10px">${vis.length} de ${todas.length} ${vis.length===1?"leitura":"leituras"}, cerca de ${Math.round(minVis/60)} h, ${lidasVis} já ${lidasVis===1?"lida":"lidas"}.</div>
  </div>
  <div class="listaL">
  ${emCurso.length&&!filtrando?`<div class="cx continuar">
    <div class="mini" style="color:var(--brandInk);font-weight:600;margin-bottom:6px"><i class="ti ti-book"></i> Continuar lendo</div>
    <div class="linha">${emCurso.map(x=>`<button class="bt sec mini" data-ler="${esc(x.f)}">${esc(x.l.t)} · ${ST.prog[x.f]}%</button>`).join("")}</div>
  </div>`:""}
  ${vis.length?lista:`<div class="cx"><p class="vazio">Nenhuma leitura com esse filtro. <button class="bt sec mini" id="lLimpa2">limpar filtro</button></p></div>`}
  </div>`
  :`<div class="cx"><p class="vazio">Nenhuma leitura publicada ainda. As leituras entram por <code>leituras.js</code> + um arquivo em <code>leituras/</code>.</p></div>`;
  const aplica=(k,v)=>{ST.cfg.fl[k]=v;salva("cfg",ST.cfg);pintaLeituras()};
  const limpa=()=>{ST.cfg.fl={area:"",areas:[],busca:"",so:"",gr:""};salva("cfg",ST.cfg);pintaLeituras()};
  $$("[data-lgr]").forEach(b=>b.onclick=()=>{ST.cfg.fl.gr=b.dataset.lgr;ST.cfg.fl.areas=(ST.cfg.fl.areas||[]).filter(id=>!b.dataset.lgr||GDE[id]===b.dataset.lgr);ST.cfg.fl.area=ST.cfg.fl.areas[0]||"";salva("cfg",ST.cfg);pintaLeituras()});
  seletorAreas($("#lArea"),{
    opcoes:comLeitura.filter(t=>!fl.gr||t.grande===fl.gr).map(t=>({id:t.id,nome:t.nome,n:todas.filter(l=>l.area===t.id).length})),
    selecionados:fla, unidade:["leitura","leituras"],
    conta:ids=>todas.filter(l=>casa(l,new Set(ids))).length,   /* com busca e lidas/não lidas aplicadas */
    aoMudar:ids=>{const a=ordAreas(ids);ST.cfg.fl.areas=a;ST.cfg.fl.area=a[0]||"";salva("cfg",ST.cfg);pintaLeituras()}});
  if($("#lSo"))$("#lSo").onchange=e=>aplica("so",e.target.value);
  if($("#lLimpa"))$("#lLimpa").onclick=limpa;
  if($("#lLimpa2"))$("#lLimpa2").onclick=limpa;
  const cb=$("#lBusca");
  if(cb){
    let deb; cb.oninput=e=>{clearTimeout(deb);const v=e.target.value;
      deb=setTimeout(()=>{const pos=cb.selectionStart;aplica("busca",v);
        const n=$("#lBusca");if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}},250)};
  }
  $$("[data-ler]").forEach(b=>{
    const abre=()=>{ST.cfg.lendo=b.dataset.ler;salva("cfg",ST.cfg);pintaLeituras()};
    b.onclick=abre;
    if(b.getAttribute("role")==="button")b.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();abre()}};
  });
}
/* Item de catálogo, não cartão. Antes cada leitura era uma caixa com borda, sombra, cinco pílulas
   e o resumo inteiro — dois materiais preenchiam a tela e percorrer 99 leituras era impossível.
   Agora: título, duas linhas de resumo e UMA linha de procedência. O resumo completo está no dek
   da própria leitura, que é onde ele serve. */
function cartaoLeitura(l){
  const pg=ST.prog[l.f]||0;
  const estado=ST.lidas[l.f]?'<span class="lido"><i class="ti ti-check"></i>lida</span>'
              :pg>0?`<span class="lido">${pg}% lido</span>`:"";
  return `<article class="itemL" data-ler="${esc(l.f)}" tabindex="0" role="button" style="--ca:${corArea(l.area)}">
    <h3>${esc(l.t)}<i class="ti ti-arrow-up-right" aria-hidden="true"></i></h3>
    <p class="resumoL">${esc(l.s)}</p>
    <div class="metaL"><span>${esc(NOME[l.area]||l.area||"")}</span><span>${esc(l.tipo||"")}</span><span>${l.min} min</span>${estado}</div>
    ${pg>0&&!ST.lidas[l.f]?`<div class="progL"><i style="width:${pg}%"></i></div>`:""}
  </article>`;
}
/* A leitura (iframe) avisa até onde rolou. Guarda o MÁXIMO por arquivo; a partir de 95% conta
   como lida sozinha — quem chegou ao fim não deveria ter de voltar ao topo para marcar. */
let progDeb;
addEventListener("message",e=>{
  const m=e.data; if(!m)return;
  if(m.cm==="sec"&&m.id){
    const nav=$("#sumarioL"); if(nav){
      $$("#sumarioL a").forEach(a=>a.classList.toggle("aqui",a.dataset.sec===m.id));
      const at=nav.querySelector("a.aqui");
      if(at&&at.offsetTop<nav.scrollTop||at&&at.offsetTop>nav.scrollTop+nav.clientHeight-40)
        nav.scrollTop=Math.max(0,at.offsetTop-nav.clientHeight/2);
    }
    return;
  }
  if(m.cm!=="prog"||!m.f)return;
  const pct=Math.max(0,Math.min(100,Math.round(+m.pct||0)));
  if(pct<=(ST.prog[m.f]||0))return;
  ST.prog[m.f]=pct;
  clearTimeout(progDeb); progDeb=setTimeout(()=>salva("prog",ST.prog),1500);
  if(pct>=95&&!ST.lidas[m.f]){ST.lidas[m.f]=true;salva("lidas",ST.lidas);atividade(2);

function avaliaCartao(i,q){
  const e=cartaoDe(i);
  if(q<3){e.n=0;e.int=1}
  else{e.n++;e.int=e.n===1?1:e.n===2?6:Math.round(e.int*e.ef);
       e.ef=Math.max(1.3,e.ef+(0.1-(5-q)*(0.08+(5-q)*0.02)))}
  const d=new Date();d.setDate(d.getDate()+e.int);e.prox=dataISO(d);
  ST.flash[i]=e;salva("flash",ST.flash);
}

<script>
/* ================= aba PAINEL ================= */
function estatArea(){
  return TAX.map(t=>{
    const qs=BANCO.filter(q=>q.tema===t.id);
    let n=0,ok=0;
    qs.forEach(q=>{const h=(respostaDe(q)||{}).hist||[];if(h.length){n++;if(okH(q,h[h.length-1]))ok++}});
    const taxa=n?ok/n:null, cob=qs.length?n/qs.length:0;
    /* prioridade = peso na prova × (o que você erra) × (o quanto ainda não viu) */
    const prio=t.peso*(1-(taxa===null?0.5:taxa))*(1.3-cob);
    return {t,total:qs.length,n,ok,taxa,cob,prio};
  }).sort((a,b)=>b.prio-a.prio);
}
/* ================= aba INÍCIO =================
   Primeira tela: o que fazer agora. Meta do dia (questões respondidas hoje), sequência de dias,
   atividade das duas últimas semanas, atalhos com número real e as áreas onde o ganho é maior

const corArea=id=>CORG[GDE[id]]||COR_AREA[Math.max(0,TAX.findIndex(t=>t.id===id))%COR_AREA.length];
function diasSeguidos(){
  let n=0;const d=new Date();
  if(!ST.atividade[dataISO(d)])d.setDate(d.getDate()-1);

let COMBO=0;
function vivo(sec){
  if(!sec)return;
  const alvo=sec.querySelector(".vIni")||sec;
  alvo.classList.remove("anima");void alvo.offsetWidth;alvo.classList.add("anima");
  [...alvo.children].forEach((c,k)=>c.style.setProperty("--i",Math.min(k,12)));
  const reduz=matchMedia("(prefers-reduced-motion:reduce)").matches;
  sec.querySelectorAll("[data-conta]").forEach(el=>{
    const fim=+el.dataset.conta, suf=el.dataset.suf||"";
    if(reduz||!fim){el.textContent=fim+suf;return}
    const t0=performance.now(),d=900;
    const passo=t=>{const p=Math.min(1,(t-t0)/d),e=1-Math.pow(1-p,3);el.textContent=Math.round(fim*e)+suf;if(p<1)requestAnimationFrame(passo)};
    requestAnimationFrame(passo);
  });
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    sec.querySelectorAll("[data-w]").forEach(el=>el.style.width=el.dataset.w);
    sec.querySelectorAll("[data-h]").forEach(el=>el.style.height=el.dataset.h);

/* confete leve em canvas: 1,4 s, some sozinho; nada se movimento reduzido */
function confete(){
  if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  const cv=document.createElement("canvas");cv.className="confete";document.body.appendChild(cv);
  const W=cv.width=innerWidth*devicePixelRatio,H=cv.height=innerHeight*devicePixelRatio,x=cv.getContext("2d");
  const cores=["#5B5BF0","#2F7BF6","#F76E1E","#11A870","#8E5AF2","#F2A007","#E8468E","#0AA5C2"];
  const ps=[...Array(140)].map(()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.35,vx:(Math.random()-.5)*26*devicePixelRatio,vy:(-Math.random()*22-6)*devicePixelRatio,
    s:(6+Math.random()*7)*devicePixelRatio,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cores[Math.random()*cores.length|0],f:Math.random()<.5}));
  const t0=performance.now();
  const q=t=>{const el=t-t0;x.clearRect(0,0,W,H);
    ps.forEach(p=>{p.vy+=.9*devicePixelRatio;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.globalAlpha=Math.max(0,1-el/1600);x.fillStyle=p.c;
      if(p.f)x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);else{x.beginPath();x.arc(0,0,p.s/3,0,7);x.fill()}x.restore()});
    if(el<1600)requestAnimationFrame(q);else cv.remove()};
  requestAnimationFrame(q);
}

   <button class="bt mini" id="btTreinarErros" style="margin-top:8px">Treinar só os erros</button></div>`:""}
  <div class="cx" id="cxSinal"><h3 style="margin:0 0 4px">Questões sinalizadas</h3>
   <p class="mini" style="margin:0 0 10px">As que você marcou com a bandeira por achar um erro. Elas vão para a equipe que revisa o banco.</p>

    <div class="kpi"><b>${devidos().length}</b><span>cartões para hoje</span></div>
    <div class="kpi"><b>${ST.sim.length}</b><span>simulados feitos</span></div>
   </div>
  </div>`;
  if($("#btTreinarErros"))$("#btTreinarErros").onclick=()=>{
    ST.pos.fq={area:"",areas:[],cen:"",comp:"",niv:"",modo:"erros"};ST.pos.assq=null;ST.pos.chq=null;
    salva("pos",ST.pos);irAba("questoes")};
  /* abrir uma sinalizada: conjunto "sinalizadas", sem outros filtros, parado nela */
  const abreSinal=ch=>abreQuestaoEm({area:"",areas:[],cen:"",comp:"",niv:"",modo:"sinal",proc:""},ch);
  SINAL.lista($("#pSinal"),{abreQuestao:ch=>{
    if(ER.oculta(ch))return UI.banner("avi","Essa questão foi retirada do ar pela revisão.");
    if(!QIDX.has(ch))return UI.banner("avi","Essa questão foi corrigida ou saiu do banco depois que você a sinalizou.");
    abreSinal(ch)}});
  /* a lista se redesenha sozinha ao tirar itens; o botão não, então confere na hora */
  if($("#btTreinarSinal"))$("#btTreinarSinal").onclick=()=>SINAL.total()?abreSinal(null):pintaPainel();
}

/* ================= aba AJUSTES ================= */
async function pintaOffline(){
  const cx=$("#cxOff"); if(!cx)return;
  if(!("caches" in window)){cx.innerHTML=`<p class="mini">Este navegador não guarda páginas para uso offline.</p>`;return}
  const e=await OFF.estado();
  const tudo=e.faltam.length===0&&e.total>0;
  cx.innerHTML=tudo
    ? `<p class="mini" style="color:var(--ok);font-weight:600"><i class="ti ti-circle-check"></i> Biblioteca inteira no aparelho: ${e.total} arquivos.</p>
       <div class="linha" style="margin-top:8px"><button class="bt sec mini" id="btOffRem">Liberar o espaço</button></div>`
    : `<div class="linha"><button class="bt" id="btOffBaixa"><i class="ti ti-download"></i> Baixar a biblioteca</button>
        <span class="mini">${e.baixados} de ${e.total} já guardados</span></div>
       ${e.baixados?`<div class="progOff"><i style="width:${Math.round(100*e.baixados/e.total)}%"></i></div>`:""}`;
  if($("#btOffRem"))$("#btOffRem").onclick=async()=>{
    if(!confirm("Remover a biblioteca guardada? As leituras voltam a precisar de internet. Seu progresso não é afetado."))return;
    await OFF.remove(); pintaOffline();
  };
  if($("#btOffBaixa"))$("#btOffBaixa").onclick=async()=>{
    const b=$("#btOffBaixa"); b.disabled=true;
    cx.innerHTML=`<p class="mini">Baixando… <span id="offN">0</span> de <span id="offT">?</span></p><div class="progOff"><i id="offBar" style="width:0"></i></div>`;
    await OFF.baixa((n,tot)=>{
      const a=$("#offN"),c2=$("#offT"),bar=$("#offBar");
      if(a)a.textContent=n; if(c2)c2.textContent=tot; if(bar)bar.style.width=Math.round(100*n/tot)+"%";
    });
    UI.banner("ok","Biblioteca guardada. Agora ela abre sem internet.");
    pintaOffline();
  };
}

/* ================= boot ================= */
(async function(){
  carregaEstado();
  await ARM.boot();
  carregaEstado();
  aplicaTema();
  NUVEM.boot();   /* portão de login + sincronização automática (mtsync.js) */
  matchMedia("(prefers-color-scheme:dark)").addEventListener("change",()=>{if((ST.cfg.tema||"auto")==="auto")aplicaTema()});
  montaAbas();
  /* deep-link das leituras: ../index.html?area=<tema>#questoes aplica o filtro e limpa a URL.
     O parâmetro é `area` e não `tema` para não colidir com o ?tema= do claro/escuro. */
  const par=new URLSearchParams(location.search), areaLink=par.get("area");
  if(areaLink&&TAX.some(t=>t.id===areaLink)){
    ST.pos.fq={area:areaLink,areas:[areaLink],cen:"",comp:"",niv:"",modo:"todas"};
    ST.pos.assq=null;ST.pos.chq=null;salva("pos",ST.pos);ST.cfg.aba="questoes";ST.cfg.lendo=null;salva("cfg",ST.cfg);
    history.replaceState(null,"",location.pathname);
  }
  irAba(ST.cfg.aba&&PINTA[ST.cfg.aba]?ST.cfg.aba:"inicio");
  convidaInstalar();
  /* atalho do toque longo no ícone (manifest shortcuts): ?ir=<aba> */
  /* ?busca=<termo>: o "Treinar no FlashMed" do CondutAI (antes ?tema= no flashmed.html, que redireciona para cá) */
  const buscaPar=par.get("busca");
  if(buscaPar){history.replaceState(null,"",location.pathname);setTimeout(()=>abreBusca(buscaPar),300)}
  const irPar=par.get("ir");
  if(irPar&&PINTA[irPar]){ST.cfg.aba=irPar;salva("cfg",ST.cfg);history.replaceState(null,"",location.pathname)}
  if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
  window.__cm={ST,ARM,BANCO,BANCO_BASE,ER,QIDX,chaveQ,embaralha,espalhaTemas,irAba,estatArea,V};
})();
